name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install icon tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-noto-cjk

      - name: Create Capacitor project
        run: |
          mkdir apk && cd apk
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<html><body></body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sikwondaebbang.babmuckja",
            "appName": "밥먹자",
            "webDir": "www",
            "server": {
              "url": "https://sikwondaebbang.github.io/babmuckja/",
              "cleartext": false
            },
            "android": { "backgroundColor": "#1428A0" }
          }
          EOF
          npx cap add android

      - name: Add location permission
        working-directory: apk
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Generate text icon
        working-directory: apk
        run: |
          FONT=$(fc-list | grep -i "NotoSansCJK-Bold" | head -1 | cut -d: -f1)
          convert -size 1024x1024 xc:'#1428A0' -font "$FONT" -pointsize 200 \
            -gravity center -fill white -annotate 0 '밥먹자' icon.png
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=$RES/mipmap-${d%%:*}
            size=${d##*:}
            convert icon.png -resize ${size}x${size} $dir/ic_launcher.png
            convert icon.png -resize ${size}x${size} $dir/ic_launcher_round.png
          done

      - name: Build debug APK
        working-directory: apk/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: babmuckja-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
