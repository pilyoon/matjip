<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1428A0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="밥먹자">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>밥먹자 - 맛집 지도</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<header id="topbar">
  <div id="searchbar">
    <input id="q" type="search" placeholder="🔍 맛집·장소·주소 검색" autocomplete="off">
    <div id="q-results" class="hidden"></div>
  </div>
  <div id="filters"></div>
  <div id="tfilters"></div>
</header>

<div id="legend">
  <span><i class="dot dk"></i>식권대장</span>
  <span><i class="dot bp"></i>비플페이</span>
  <span><i class="dot both"></i>둘 다</span>
  <span><i class="dot wish"></i>법카조르기</span>
</div>

<div id="fabs">
  <button id="btn-locate" class="fab small" title="내 위치">📍</button>
  <button id="btn-list" class="fab small" title="목록">📋</button>
  <button id="btn-install" class="fab small hidden" title="홈 화면에 추가">📲</button>
  <button id="btn-pick" class="fab pill" title="점심 메뉴 추천">🎲 점메추</button>
  <button id="btn-add" class="fab" title="맛집 등록">＋</button>
</div>

<!-- 댓글 시트 -->
<section id="sheet-comments" class="sheet hidden">
  <div class="sheet-head"><strong id="cm-title">댓글</strong><button class="link" id="cm-close">닫기</button></div>
  <div class="sheet-body">
    <div id="cm-list"></div>
    <div class="inline" style="align-items:flex-end">
      <textarea id="cm-input" rows="2" maxlength="200" placeholder="익명으로 댓글 남기기 (200자)" style="margin:0"></textarea>
      <button id="cm-send" class="btn-main" style="width:auto;padding:0 18px;height:46px;flex:none">등록</button>
    </div>
    <p class="hint" style="margin:8px 0 0">🕶️ 다른 회원에게는 닉네임 없이 '익명N'으로만 보입니다.</p>
  </div>
</section>

<!-- 점메추 -->
<div id="pick" class="hidden">
  <div id="pick-box">
    <div id="pick-title">오늘 점심은…?</div>
    <div id="deck">
      <div class="pcard"></div><div class="pcard"></div><div class="pcard"></div><div class="pcard"></div><div class="pcard"></div>
      <div id="result" class="hidden"></div>
    </div>
    <div id="pick-sub"></div>
    <div id="pick-actions" class="hidden">
      <button id="pick-map" class="btn-main">지도에서 보기</button>
      <div class="inline"><button id="pick-again" class="btn-sub" style="padding:11px 14px">🔄 다시 뽑기</button><button id="pick-close" class="btn-sub" style="padding:11px 14px">닫기</button></div>
    </div>
  </div>
</div>

<!-- 홈 화면에 추가 안내 -->
<section id="sheet-install" class="sheet hidden">
  <div class="sheet-head"><strong>📲 홈 화면에 추가</strong><button class="link" id="install-close">닫기</button></div>
  <div class="sheet-body" id="install-body"></div>
</section>

<!-- 등록/수정 시트 -->
<section id="sheet-form" class="sheet hidden">
  <div class="sheet-head">
    <strong id="form-title">맛집 등록</strong>
    <button class="link" id="form-cancel">닫기</button>
  </div>
  <div class="sheet-body">
    <p class="hint">📌 지도를 탭하거나 핀을 드래그해서 위치를 조정하세요.</p>
    <div class="field">이름 (🔍로 검색하면 위치가 자동 입력)
      <div class="inline" style="margin-top:4px">
        <input id="f-name" placeholder="식당 이름" maxlength="50">
        <button id="f-search" class="btn-sub" type="button">🔍 검색</button>
      </div>
      <div id="f-results"></div>
    </div>
    <div class="field">카테고리<div id="f-cats" class="chips"></div></div>
    <div class="field">별점<div id="f-stars" class="stars"></div></div>
    <div class="field">식권 종류 (중복 선택 가능 · 법카조르기=법인카드로 먹고 싶은 곳)<div id="f-tickets" class="chips"></div></div>
    <label>메모<textarea id="f-memo" rows="2" placeholder="대표 메뉴, 가격 등"></textarea></label>
    <div id="f-coord" class="hint"></div>
    <button id="f-save" class="btn-main">저장</button>
  </div>
</section>

<!-- 목록 시트 -->
<section id="sheet-list" class="sheet hidden">
  <div class="sheet-head">
    <strong>맛집 목록</strong>
    <span>
      <button class="link" id="btn-logout">로그아웃</button>
      <button class="link" id="list-close">닫기</button>
    </span>
  </div>
  <div class="sheet-body" id="list-body"></div>
</section>

<!-- 로그인 시트 -->
<section id="sheet-auth" class="sheet hidden">
  <div class="sheet-head"><strong>🍽️ 맛집 지도 로그인</strong></div>
  <div class="sheet-body">
    <label>이메일<input id="a-email" type="email" autocomplete="email" placeholder="name@example.com"></label>
    <label>비밀번호 (6자 이상)<input id="a-pw" type="password" autocomplete="current-password"></label>
    <label>별명 (선택 · 가입할 때만, 비우면 이메일 앞부분)<input id="a-nick" maxlength="20" placeholder="예: 맛집탐험가"></label>
    <div class="inline">
      <button id="a-login" class="btn-main">로그인</button>
      <button id="a-signup" class="btn-sub" type="button">가입</button>
    </div>
    <p class="hint" style="margin-top:10px">💡 이메일과 비밀번호를 입력하고 <b>가입</b>을 누르면 바로 이용할 수 있습니다.</p>
    <p id="a-msg" class="hint" style="margin-top:10px"></p>
  </div>
</section>

<!-- 승인 대기/거절 안내 -->
<section id="sheet-pending" class="sheet hidden">
  <div class="sheet-head"><strong id="p-title">⏳ 승인 대기 중</strong><button class="link" id="p-logout">로그아웃</button></div>
  <div class="sheet-body">
    <p id="p-msg">승인 대기 중입니다.</p>
    <button id="p-refresh" class="btn-sub" style="padding:10px 14px">승인 여부 새로고침</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
